services:
  - type: web
    name: local-study-companion
    runtime: docker
    plan: free
    envVars:
      - key: PUBLIC_MODE
        value: true
      - key: BROWSERBASE_API_KEY
        sync: false
      - key: APP_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
